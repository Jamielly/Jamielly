name: Generate Pac-Man Contribution Graph

on:
  # Atualiza diariamente
  schedule:
    - cron: "0 0 * * *"

  # Permite execução manual
  workflow_dispatch:

  # Atualiza quando houver push na main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pac-Man animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Jamielly
          games: pacman
          player_style: opportunistic

      - name: Publish SVG files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
